# Method league (see docs/superpowers/specs/2026-11-08-china-market-league-design.md)
live_max: 6
min_trades: 20
promote_after_passes: 2
similar_rank_corr: 0.85
similar_jaccard: 0.70
retire_after_passes: 3
retire_min_days: 28
bench_window_days: 1095
bench_min_gap_days: 13
# Never eligible for live: stacked_live refits every live method per fold, too
# slow for the weekly full-history backtest, and its bases change with the live set.
bench_only_prefixes: [stacked_live]
# Compute server (B) runs part of a market's bench pass in parallel (see
# scripts/bench_worker.py). remote_speed: B's pace vs A (1.0 = same); max_share:
# most of the work B may get; stale_minutes: B silent this long -> A takes it back.
remote_bench:
  china:
    enabled: true
    remote_speed: 1.0
    max_share: 0.8
    exclude: [stacked_live]
    stale_minutes: 30
    start_minutes: 90   # time for B to download its inputs (~58 MB at ~30 KB/s)

strategies:
  - name: bollinger_bounce
    class: src.strategies.rule_based.bollinger.BollingerBounce
    params:
      window: 20
      num_std: 2.0

  - name: logistic_regression
    class: src.strategies.statistical.logistic.LogisticStrategy
    params:
      C: 1.0
      max_iter: 200

  - name: linear_regression
    class: src.strategies.statistical.linear.LinearStrategy
    params:
      buy_threshold: 0.005

  - name: stochastic_oscillator
    class: src.strategies.rule_based.stochastic.StochasticOscillator
    params:
      k_period: 14
      d_period: 3
      oversold: 20.0

  - name: cci
    class: src.strategies.rule_based.cci.CCIStrategy
    params:
      period: 20
      oversold: -100.0

  - name: williams_r
    class: src.strategies.rule_based.williams_r.WilliamsR
    params:
      period: 14
      oversold: -80.0

  - name: mean_reversion
    class: src.strategies.rule_based.mean_reversion.MeanReversion
    params:
      window: 60
      z_threshold: -1.5

  - name: momentum
    class: src.strategies.rule_based.momentum.MomentumStrategy
    params:
      period: 20
      threshold: 0.03

  - name: gradient_boosting
    class: src.strategies.statistical.gradient_boosting.GradientBoostingStrategy
    params:
      max_iter: 100
      max_depth: 3
      learning_rate: 0.1

  - name: bollinger_rsi_combo
    class: src.strategies.rule_based.bollinger_rsi_combo.BollingerRSICombo
    params:
      bb_window: 20
      bb_std: 2.0
      rsi_period: 14
      rsi_max: 45.0

  - name: elder_ray
    class: src.strategies.rule_based.elder_ray.ElderRay
    params:
      period: 13

  - name: pvt_trend
    class: src.strategies.rule_based.pvt_trend.PVTTrend
    params:
      pvt_window: 20
      price_window: 5

  - name: atr_breakout
    class: src.strategies.rule_based.atr_breakout.ATRBreakout
    params:
      lookback: 10
      atr_period: 14
      atr_multiplier: 0.5

  - name: trend_pullback
    class: src.strategies.rule_based.trend_pullback.TrendPullback
    params:
      short: 10
      mid: 50
      long: 200
      rsi_period: 14
      rsi_low: 35.0
      rsi_high: 50.0

  - name: random_forest
    class: src.strategies.statistical.random_forest.RandomForestStrategy
    params:
      n_estimators: 100
      max_depth: 10

  - name: xgboost_strategy
    class: src.strategies.statistical.xgboost_strategy.XGBoostStrategy
    params:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1

  - name: extra_trees
    class: src.strategies.statistical.extra_trees.ExtraTreesStrategy
    params:
      n_estimators: 100
      max_depth: 10

  - name: mlp_classifier
    class: src.strategies.statistical.mlp_classifier.MLPStrategy
    params:
      hidden_layer_sizes: [64, 32]
      max_iter: 100

  - name: knn_classifier
    class: src.strategies.statistical.knn_classifier.KNNStrategy
    params:
      n_neighbors: 10

  - name: catboost_strategy
    class: src.strategies.statistical.catboost_strategy.CatBoostStrategy
    params:
      iterations: 200
      depth: 6
      learning_rate: 0.1

  - name: money_flow_index
    class: src.strategies.rule_based.money_flow_index.MoneyFlowIndex
    params:
      period: 14
      oversold: 30.0

  - name: gaussian_nb
    class: src.strategies.statistical.gaussian_nb_strategy.GaussianNBStrategy
    params:
      var_smoothing: 1.0e-9

  - name: lda_strategy
    class: src.strategies.statistical.lda_strategy.LDAStrategy
    params:
      solver: svd

  - name: trix
    class: src.strategies.rule_based.trix.TRIX
    params:
      period: 15

  - name: kalman_trend
    class: src.strategies.rule_based.kalman_trend.KalmanTrend
    params:
      process_var: 1.0e-4
      obs_var: 1.0
      slope_threshold: 0.0

  - name: isolation_forest_anomaly
    class: src.strategies.statistical.isolation_forest_strategy.IsolationForestAnomaly
    params:
      n_estimators: 100
      contamination: 0.05
      rsi_oversold: 40.0

  - name: meta_labeling
    class: src.strategies.statistical.meta_labeling.MetaLabelingStrategy
    params:
      primary_threshold: 0.4
      meta_fraction: 0.3
      buy_threshold: 0.5

  - name: conformal_lgbm
    class: src.strategies.statistical.conformal_lgbm.ConformalLGBMStrategy
    params:
      alpha: 0.3
      calib_fraction: 0.25
      buy_threshold: 0.5

  - name: pooled_lgbm_news
    class: src.strategies.statistical.pooled_lgbm.PooledLGBMStrategy
    markets: [us]  # needs the US news/macro feature columns
    params:
      use_news_macro: true

  - name: pooled_lgbm_news_cn
    class: src.strategies.statistical.pooled_lgbm.PooledLGBMStrategy
    markets: [china]  # China news + PBoC/NBS macro columns
    params:
      use_news_macro: true
      market: china

  - name: cross_sectional_ranker
    class: src.strategies.statistical.cross_sectional_ranker.CrossSectionalRankerStrategy
    params:
      calib_fraction: 0.25
      buy_threshold: 0.5

  - name: regime_consensus
    class: src.strategies.statistical.regime_consensus.RegimeConsensusStrategy
    params:
      holdout_fraction: 0.3
      buy_threshold: 0.5
      n_regimes: 3

  - name: cross_sectional_ranker_news
    class: src.strategies.statistical.cross_sectional_ranker.CrossSectionalRankerStrategy
    markets: [us]  # league bench candidate (2026-11-08)
    params:
      use_news_macro: true
      market: us

  - name: cross_sectional_ranker_news_cn
    class: src.strategies.statistical.cross_sectional_ranker.CrossSectionalRankerStrategy
    markets: [china]  # league bench candidate (2026-11-08)
    params:
      use_news_macro: true
      market: china

  - name: news_surprise
    class: src.strategies.statistical.news_surprise.NewsSurpriseStrategy
    markets: [us]  # league bench candidate (2026-11-08)
    params:
      market: us

  - name: news_surprise_cn
    class: src.strategies.statistical.news_surprise.NewsSurpriseStrategy
    markets: [china]  # league bench candidate (2026-11-08)
    params:
      market: china

  - name: regime_gated
    class: src.strategies.statistical.regime_gated.RegimeGatedStrategy
    markets: [us]  # league bench candidate (2026-11-08)
    params:
      market: us

  - name: regime_gated_cn
    class: src.strategies.statistical.regime_gated.RegimeGatedStrategy
    markets: [china]  # league bench candidate (2026-11-08)
    params:
      market: china

  - name: stacked_live
    class: src.strategies.statistical.stacked_live.StackedLiveStrategy
    markets: [us]  # league bench candidate (2026-11-08)
    params:
      market: us

  - name: stacked_live_cn
    class: src.strategies.statistical.stacked_live.StackedLiveStrategy
    markets: [china]  # league bench candidate (2026-11-08)
    params:
      market: china
